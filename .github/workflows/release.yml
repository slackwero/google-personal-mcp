name: Release

# Pushing a vX.Y.Z tag that matches the version in pyproject.toml tests the code,
# builds the package (sdist and wheel) and publishes it, with SHA-256 checksums
# and signed build provenance, as a GitHub Release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the build provenance with a Sigstore certificate
      attestations: write # store the provenance attestation
      artifact-metadata: write # record the attested artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Same pin as ci.yml. Dependabot does not bump this input: update it by hand.
          version: "0.13.6"

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="$(uv version --short)"
          if [ "$TAG" != "v${version}" ]; then
            echo "Tag ${TAG} does not match the version in pyproject.toml (${version})."
            exit 1
          fi

      - name: Test
        run: |
          uv sync --locked
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked pytest -q

      - name: Build
        run: |
          set -eu
          uv build --out-dir dist
          cd dist
          for file in *.whl *.tar.gz; do
            sha256sum "$file" > "${file}.sha256"
          done
          ls -l

      # Signed SLSA build provenance for each package, verifiable with
      # `gh attestation verify <file> --repo slackwero/google-personal-mcp`. It runs
      # before publishing, so a failed attestation never ships a release.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.whl dist/*.tar.gz dist/*.sha256 \
            --verify-tag --title "google-personal-mcp $TAG" --generate-notes
