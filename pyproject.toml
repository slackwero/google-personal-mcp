[project]
name = "google-personal-mcp"
version = "0.1.0"
description = "Local stdio MCP server that gives Claude Code access to a personal Gmail account."
requires-python = ">=3.15"
dependencies = [
    "anyio>=4.15.1",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "httplib2>=0.32.1",
    "mcp>=2.3,<3",
    "pydantic>=2.14",
    "requests>=2.34.2",
]

[project.scripts]
google-personal-mcp = "google_personal_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
extend-exclude = ["docs", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "UP", "ASYNC", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
